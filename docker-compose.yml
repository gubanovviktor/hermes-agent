services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-agent-dokploy-ssh:latest
    restart: unless-stopped
    ports:
      - "${HERMES_SSH_HOST_PORT:-2223}:22"
    volumes:
      - hermes-data:/opt/data
    environment:
      HERMES_UID: "${HERMES_UID:-10000}"
      HERMES_GID: "${HERMES_GID:-10000}"
      HERMES_SSH_AUTHORIZED_KEY: "${HERMES_SSH_AUTHORIZED_KEY}"
      HONCHO_BASE_URL: "http://honcho-api:8000"
      HONCHO_API_KEY: "${HONCHO_WORKSPACE_TOKEN}"
    networks:
      - default
      - honcho-memory
    command: ["sh", "-lc", "hermes config set memory.provider honcho >/dev/null 2>&1 || true; sleep infinity"]

volumes:
  hermes-data:

networks:
  honcho-memory:
    external: true
    name: honcho-memory
